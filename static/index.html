<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#161E28">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Farewatch">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="stylesheet" href="/app.css">
<title>Farewatch</title>
</head>
<body>

<main id="app">
  <div class="boot">Loading last known fare…</div>
</main>

<template id="tpl-trip">
  <section class="trip">

    <header class="route">
      <div class="route-code">
        <span data-f="origin"></span><i class="arrow">→</i><span data-f="dest"></span>
      </div>
      <div class="route-meta">
        <span data-f="dateline"></span>
        <span class="freshness"><i class="dot" data-f="dot"></i><span data-f="asof"></span></span>
      </div>
    </header>

    <!-- signature: the coupon -->
    <div class="coupon" data-f="coupon">
      <div class="verdict" data-f="verdict"></div>
      <div class="fare" data-f="fare"></div>
      <div class="fare-sub" data-f="faresub"></div>

      <div class="position">
        <div class="lbl">Position in observed range</div>
        <div class="track">
          <div class="fill" data-f="fill"></div>
          <div class="notch" data-f="notch"><span>target</span></div>
          <div class="marker" data-f="marker"></div>
        </div>
        <div class="track-ends">
          <span data-f="low"></span><span data-f="high"></span>
        </div>
      </div>
    </div>

    <div class="spark-wrap">
      <svg class="spark" data-f="spark" viewBox="0 0 320 72" preserveAspectRatio="none"></svg>
      <div class="spark-lbl" data-f="sparklbl"></div>
    </div>

    <div class="stats">
      <div class="stat"><span class="lbl">Observed</span><span class="val" data-f="n"></span></div>
      <div class="stat"><span class="lbl">Percentile</span><span class="val" data-f="pctl"></span></div>
      <div class="stat"><span class="lbl">7-day</span><span class="val" data-f="d7"></span></div>
    </div>

    <ul class="rows">
      <li><span class="lbl">Fare bucket</span><span class="val" data-f="bucket"></span></li>
      <li><span class="lbl">Viable itineraries</span><span class="val" data-f="opts"></span></li>
      <li><span class="lbl">Decide by</span><span class="val" data-f="deadline"></span></li>
    </ul>

    <section class="itin" data-f="itinbox" hidden>
      <div class="itin-head">
        <span class="lbl">Your itinerary</span>
        <span class="badge" data-f="estbadge" hidden>estimate</span>
      </div>
      <div class="itin-sum" data-f="itinsum"></div>
      <ol class="leg" data-f="legs"></ol>
      <p class="itin-note" data-f="itinnote"></p>
    </section>

    <ul class="reasons" data-f="reasons"></ul>
  </section>
</template>

<footer class="bar">
  <button id="refresh" type="button">Check fares now</button>
  <p id="status" role="status"></p>
</footer>

<script src="/app.js"></script>
</body>
</html>
