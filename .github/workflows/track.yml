name: Track fares

on:
  schedule:
    # Twice daily (UTC). 13:00 = ~8am Central, 01:00 = ~8pm Central.
    - cron: "0 13 * * *"
    - cron: "0 1 * * *"
  workflow_dispatch:        # lets you run it on demand from the Actions tab

permissions:
  contents: write           # needed to commit the new reading back

concurrency:
  group: track-fares
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          # typing_extensions is imported by fast_flights.querying but is not
          # declared in its metadata, so a clean install of 3.1.0 fails at
          # import. Install it explicitly rather than relying on another
          # package happening to pull it in.
          python -m pip install "fast-flights==3.1.0" typing_extensions playwright
          # MCI-UVF results are rendered client-side, so the collector needs a
          # real browser. See gflights.py for why no HTTP-only client can do it.
          python -m playwright install --with-deps chromium
          python -c "import fast_flights, primp; print('fast_flights + primp import OK')"

      - name: Take a reading
        env:
          FAREWATCH_TO:        ${{ secrets.FAREWATCH_TO }}
          FAREWATCH_SMTP_USER: ${{ secrets.FAREWATCH_SMTP_USER }}
          FAREWATCH_SMTP_PASS: ${{ secrets.FAREWATCH_SMTP_PASS }}
        run: python collect.py
        timeout-minutes: 15

      - name: Commit if changed
        run: |
          git config user.name  "farewatch-bot"
          git config user.email "actions@github.com"
          # Stage the whole folder: notified.json only exists once email is
          # configured, and naming a missing path makes git exit 128.
          git add docs/
          if git diff --staged --quiet; then
            echo "no change"
          else
            git commit -m "fares: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
